AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Naija Lotto Oracle - Full Stack AI Application using AWS Bedrock Claude
  Sonnet 4.5
Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        BEDROCK_MODEL_ID: claude-3-5-sonnet-20241022
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
    - dev
    - staging
    - prod
    Description: Environment for deployment
Resources:
  NaijaLottoOracleAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_xxxxxxxxx
      Cors:
        AllowMethods: '''POST, OPTIONS'''
        AllowHeaders: '''Content-Type, Authorization'''
        AllowOrigin: '''*'''
  PredictionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: naija-lotto-predictions-${Environment}
      CodeUri: PredictionsFunction
      Handler: app.lambda_handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource:
            Fn::Sub: arn:aws:bedrock:${AWS::Region}::model/anthropic.claude-3-5-sonnet-20241022-v2:0
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
      Events:
        PredictionsAPI:
          Type: Api
          Properties:
            RestApiId:
              Ref: NaijaLottoOracleAPI
            Path: /predictions
            Method: POST
    Metadata:
      SamResourceId: PredictionsFunction
  AnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: naija-lotto-analysis-${Environment}
      CodeUri: AnalysisFunction
      Handler: app.lambda_handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource:
            Fn::Sub: arn:aws:bedrock:${AWS::Region}::model/anthropic.claude-3-5-sonnet-20241022-v2:0
        - Effect: Allow
          Action:
          - logs:CreateLogGroup
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
      Events:
        AnalysisAPI:
          Type: Api
          Properties:
            RestApiId:
              Ref: NaijaLottoOracleAPI
            Path: /analyze
            Method: POST
    Metadata:
      SamResourceId: AnalysisFunction
  PredictionsCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: naija-lotto-predictions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: game
        AttributeType: S
      - AttributeName: year
        AttributeType: N
      KeySchema:
      - AttributeName: game
        KeyType: HASH
      - AttributeName: year
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
Outputs:
  APIEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${NaijaLottoOracleAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  PredictionsFunctionArn:
    Description: Predictions Lambda Function ARN
    Value:
      Fn::GetAtt:
      - PredictionsFunction
      - Arn
  AnalysisFunctionArn:
    Description: Analysis Lambda Function ARN
    Value:
      Fn::GetAtt:
      - AnalysisFunction
      - Arn
  PredictionsCacheTableName:
    Description: DynamoDB Cache Table Name
    Value:
      Ref: PredictionsCacheTable
