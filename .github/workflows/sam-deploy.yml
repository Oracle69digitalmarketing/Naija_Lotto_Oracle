name: Build & Deploy (SAM)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: .
        run: |
          npm ci

      - name: Build frontend
        working-directory: .
        run: |
          npm run build --if-present

      - name: Package frontend artifact
        working-directory: .
        run: |
          cd dist
          zip -r ../dist_amplify_deploy.zip .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist_amplify_deploy
          path: dist_amplify_deploy.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM stack
        env:
          AWS_REGION: eu-central-1
        run: |
          sam deploy --stack-name naija-lotto-oracle-stack \
            --region eu-central-1 \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides Environment=prod

      - name: (Optional) Upload frontend ZIP to S3
        if: ${{ secrets.FRONTEND_S3_BUCKET != '' }}
        env:
          BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
        run: |
          aws s3 cp dist_amplify_deploy.zip s3://$BUCKET/dist_amplify_deploy.zip
